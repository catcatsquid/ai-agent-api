[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    # starlette TestClient 内部的 anyio 别名弃用，第三方噪声，与本项目无关
    ignore:.*anyio\.abc\.BlockingPortal.*:DeprecationWarning
    # 测试里故意用短 JWT 密钥；运行时应用日志仍会正常提示密钥长度问题
    ignore:.*HMAC key is.*
