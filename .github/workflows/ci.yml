name: CI

# 之前这个项目**没有 CI** —— 全部测试全靠手动跑。
# （这里原来写死了「404 项测试」，而实际早就涨到 583 项。
#   同一个数字抄在文档和配置里必然过期，所以不再写具体条数 ——
#   要看数量跑一次 pytest 就有，见 tests/conftest.py 开头的报告行。）
# 加它的同时暴露了一个更根本的问题：data/ 下的课件、试卷、题库、题图都不入库
# （版权 + 体积，合计 300 MB），所以"新克隆 + 跑测试"必然缺数据。
# 处理方式见 tests/conftest.py：缺数据的用例**跳过**（而不是报红），
# 并在测试开头的报告里声明哪些数据集可用。
# 题库可在这一步之前从私有数据仓库还原（见下方 "还原题库" 步骤）：
# 没配 secret 就整步跳过，行为与今天一致。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # config.py 在**导入期**就校验 ZHIPU_API_KEY，缺了连 collect 都过不去。
      # CI 里给一个假值即可 —— 测试全程 mock 掉真实 API 调用。
      # （这也是"config 导入期硬校验"那条架构债的具体代价。）
      ZHIPU_API_KEY: dummy-key-for-ci
      AUTH_ENFORCE: "false"
      # /auth/login 在未配置 ADMIN_PASSWORD 时**故意 fail closed 返回 503**，
      # 而 course_agent.auth.JWT_ENABLED 是在**导入期**由 JWT_SECRET 求值的
      # （见 config.py: JWT_SECRET_IS_CONFIGURED → auth.JWT_ENABLED），
      # 测试里再 patch JWT_SECRET 也改不动它。
      # 这两项不配，test_auth.py 里"密码错了要 401""用户名为空要 400""登录要成功"
      # 就会统统变成 503 —— 本地因为 .env 里配了才看不出来。
      ADMIN_PASSWORD: ci-admin-password
      JWT_SECRET: ci-jwt-secret-for-tests-only
      # 题库有版权、不进公开仓库：CI 里需要的题库从**私有数据仓库**还原，
      # 只读 deploy key 存在 Actions secret（DATA_REPO_DEPLOY_KEY）。
      # 没配 secret 时这一步跳过，与"克隆下来没有题库"的行为一致（相关用例 skip）。
      # 仓库名默认 <本仓库名>-data；要换就用 Actions 变量 DATA_REPO=owner/name。
      HAS_DATA_REPO_KEY: ${{ secrets.DATA_REPO_DEPLOY_KEY != '' }}
      DATA_REPO: ${{ github.repository_owner }}/${{ vars.DATA_REPO || format('{0}-data', github.event.repository.name) }}

    steps:
      - uses: actions/checkout@v4

      - name: 还原题库（私有数据仓库，只读）
        if: env.HAS_DATA_REPO_KEY == 'true'
        env:
          DATA_REPO_KEY: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DATA_REPO_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 "git@github.com:${DATA_REPO}.git" /tmp/qbank
          mkdir -p data/question_bank
          # 只取题库 JSON：题图 13 MB，CI 用不到
          find /tmp/qbank/question_bank -maxdepth 1 -name 'questions_*.json' \
            -exec cp {} data/question_bank/ \;
          n=$(find data/question_bank -maxdepth 1 -name 'questions_*.json' | wc -l)
          echo "题库已还原：${n} 份"
          # secret 配了却还原不出来，就是配置坏了 —— 宁可红，不要静默跳过
          test "$n" -gt 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖（从锁文件装，与开发机完全一致）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: 跑 Python 测试
        run: python -m pytest tests/ -q

      # 三个文件都要跑：只跑 auth_block 会漏掉对话上下文与会话列表（52 + 14 + 41 = 107 项断言）
      - name: 跑前端断言（认证块 / 对话上下文 / 会话列表）
        run: |
          for f in tests/js/*.mjs; do
            echo "=== $f"
            node "$f"
          done

      - name: 服务能起来 + 探活
        run: |
          python -m uvicorn course_agent.server:app --host 127.0.0.1 --port 8003 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8003/health; then echo " 探活通过"; exit 0; fi
            sleep 1
          done
          echo "服务没起来"; exit 1
