<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程知识库问答 Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部栏 */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        header .logo {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        header .status {
            margin-left: auto;
            font-size: 13px;
            opacity: 0.85;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 6px;
        }

        /* 聊天区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #e0e7ff;
            color: #4f46e5;
        }

        .message.assistant .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message .content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .content {
            background: #e0e7ff;
            color: #3730a3;
        }

        .message.assistant .content {
            background: white;
            color: #1f2937;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* 工具调用展示 */
        .tool-info {
            background: #f0fdf4;
            border-left: 3px solid #4ade80;
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 4px;
            font-size: 13px;
            color: #166534;
        }

        .tool-info .tool-name {
            font-weight: 600;
        }

        /* 加载动画 */
        .loading .content {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 输入区 */
        .input-area {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e5e7eb;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            resize: none;
            max-height: 120px;
            min-height: 44px;
            line-height: 1.5;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        #input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        #send-btn:hover { opacity: 0.9; }
        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 欢迎提示 */
        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .welcome h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #6b7280;
        }

        .welcome p {
            font-size: 14px;
        }

        .welcome .examples {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .welcome .example-btn {
            padding: 10px 20px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            font-size: 14px;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s;
        }

        .welcome .example-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">📚</div>
        <h1>课程知识库问答 Agent</h1>
        <div class="status">
            <span class="status-dot"></span>
            <span id="status-text">在线</span>
        </div>
    </header>

    <div class="chat-container" id="chat">
        <div class="welcome" id="welcome">
            <h2>👋 你好！我是课程知识库问答助手</h2>
            <p>我可以帮你解答<strong>计算机网络</strong>和<strong>操作系统</strong>的问题</p>
            <div class="examples">
                <button class="example-btn" onclick="useExample('TCP三次握手是什么？')">TCP三次握手是什么？</button>
                <button class="example-btn" onclick="useExample('进程和线程有什么区别？')">进程和线程有什么区别？</button>
                <button class="example-btn" onclick="useExample('什么是死锁？如何预防？')">什么是死锁？如何预防？</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="input" placeholder="输入你的问题，按 Enter 发送..." rows="1"></textarea>
            <button id="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const welcome = document.getElementById('welcome');

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        function useExample(text) {
            input.value = text;
            sendMessage();
        }

        function addMessage(role, text) {
            if (welcome) welcome.style.display = 'none';

            const div = document.createElement('div');
            div.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '🧑' : '🤖';

            const content = document.createElement('div');
            content.className = 'content';
            content.textContent = text;

            div.appendChild(avatar);
            div.appendChild(content);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return content;
        }

        function addLoading() {
            if (welcome) welcome.style.display = 'none';

            const div = document.createElement('div');
            div.className = 'message assistant loading';
            div.id = 'loading-msg';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '🤖';

            const content = document.createElement('div');
            content.className = 'content';

            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'loading-dot';
                content.appendChild(dot);
            }

            div.appendChild(avatar);
            div.appendChild(content);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeLoading() {
            const el = document.getElementById('loading-msg');
            if (el) el.remove();
        }

        async function sendMessage() {
            const question = input.value.trim();
            if (!question) return;

            addMessage('user', question);
            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;

            addLoading();

            try {
                const res = await fetch('/api/qa/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                const data = await res.json();
                removeLoading();

                if (data.code !== 0) {
                    addMessage('assistant', '❌ 出错了：' + data.msg);
                    return;
                }

                const answer = data.data.answer;
                const tools = data.data.tools_used;

                if (tools && tools.length > 0) {
                    tools.forEach(t => {
                        const info = document.createElement('div');
                        info.className = 'tool-info';
                        info.innerHTML = `<span class="tool-name">🔧 ${t.tool}</span> → 参数: ${JSON.stringify(t.args)}`;
                        chat.lastChild.querySelector('.content').appendChild(info);
                    });
                }

                addMessage('assistant', answer);
            } catch (err) {
                removeLoading();
                addMessage('assistant', '❌ 网络错误，请检查服务是否启动');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>
