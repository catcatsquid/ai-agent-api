<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 智能助手 - 面试演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .user-avatar {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .bot-avatar {
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }

        .user-message .message-bubble {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message .message-bubble {
            background: #f3f4f6;
            color: #111827;
            border-bottom-left-radius: 4px;
        }

        .message-content {
            font-size: 14px;
            line-height: 1.5;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb;
        }

        .input-form {
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #4f46e5;
        }

        .send-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .quick-questions {
            padding: 0 20px;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb;
        }

        .quick-questions h3 {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .quick-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .quick-button {
            padding: 8px 16px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-button:hover {
            background: #f3f4f6;
            border-color: #4f46e5;
            color: #4f46e5;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #f3f4f6;
            border-radius: 18px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .welcome-screen {
            text-align: center;
            padding: 40px;
        }

        .welcome-icon {
            font-size: 64px;
            color: #4f46e5;
            margin-bottom: 20px;
        }

        .welcome-title {
            font-size: 24px;
            color: #111827;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .feature-card {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
        }

        .feature-icon {
            font-size: 24px;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .feature-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feature-desc {
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i class="fas fa-robot"></i>
                AI Agent 智能助手
            </h1>
            <div class="status">
                <div class="status-dot"></div>
                <span>在线</span>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="welcome-screen">
                <div class="welcome-icon">🤖</div>
                <h2 class="welcome-title">AI Agent 智能助手</h2>
                <p class="welcome-subtitle">基于 Plan-and-Execute 架构的专业课程问答系统</p>

                <div class="feature-grid">
                    <div class="feature-card">
                        <div class="feature-icon">🧠</div>
                        <div class="feature-title">智能规划</div>
                        <div class="feature-desc">先思考后执行</div>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">🔧</div>
                        <div class="feature-title">多工具调用</div>
                        <div class="feature-desc">知识库+搜索</div>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">💬</div>
                        <div class="feature-title">多轮对话</div>
                        <div class="feature-desc">上下文理解</div>
                    </div>
                </div>

                <div class="quick-buttons">
                    <button class="quick-button" onclick="sendQuestion('什么是TCP三次握手？')">TCP三次握手</button>
                    <button class="quick-button" onclick="sendQuestion('进程和线程的区别')">进程 vs 线程</button>
                    <button class="quick-button" onclick="sendQuestion('死锁的四个条件')">死锁条件</button>
                    <button class="quick-button" onclick="sendQuestion('虚拟内存原理')">虚拟内存</button>
                </div>
            </div>
        </div>

        <div class="quick-questions">
            <h3>快捷问题</h3>
            <div class="quick-buttons">
                <button class="quick-button" onclick="sendQuestion('HTTP和HTTPS的区别')">HTTP vs HTTPS</button>
                <button class="quick-button" onclick="sendQuestion('进程调度算法')">调度算法</button>
                <button class="quick-button" onclick="sendQuestion('什么是死锁？如何避免？')">死锁避免</button>
                <button class="quick-button" onclick="sendQuestion('解释虚拟内存管理')">虚拟内存管理</button>
                <button class="quick-button" onclick="sendQuestion('TCP拥塞控制')">拥塞控制</button>
            </div>
        </div>

        <div class="input-area">
            <form class="input-form" onsubmit="sendMessage(event)">
                <input
                    type="text"
                    class="input-field"
                    id="messageInput"
                    placeholder="输入你的问题..."
                    autocomplete="off"
                >
                <button type="submit" class="send-button">
                    <i class="fas fa-paper-plane"></i>
                    发送
                </button>
            </form>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js"></script>
    <script>
        let messageId = 0;
        const chatArea = document.getElementById('chatArea');

        // 发送消息
        async function sendMessage(event) {
            event.preventDefault();

            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // 移除欢迎界面
            const welcomeScreen = document.querySelector('.welcome-screen');
            if (welcomeScreen) {
                welcomeScreen.remove();
            }

            // 添加用户消息
            addMessage(message, 'user');
            input.value = '';

            // 显示输入中
            showTypingIndicator();

            // 模拟AI响应（实际项目中应该调用API）
            setTimeout(() => {
                removeTypingIndicator();
                const aiResponse = generateAIResponse(message);
                addMessage(aiResponse, 'bot');
            }, 1500 + Math.random() * 1000);
        }

        // 快速发送问题
        function sendQuestion(question) {
            document.getElementById('messageInput').value = question;
            sendMessage({ preventDefault: () => {} });
        }

        // 添加消息
        function addMessage(content, sender) {
            messageId++;

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.id = `message-${messageId}`;

            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${sender}-avatar`;
            avatar.innerHTML = sender === 'user' ? '我' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.textContent = content;

            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            bubble.appendChild(messageContent);
            bubble.appendChild(time);

            messageDiv.appendChild(avatar);
            if (sender === 'user') {
                messageDiv.appendChild(bubble);
            } else {
                messageDiv.appendChild(bubble);
                messageDiv.insertBefore(avatar, messageDiv.firstChild);
            }

            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 显示输入中
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'message bot-message';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar bot-avatar';
            avatar.textContent = '🤖';

            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;

            typingDiv.appendChild(avatar);
            typingDiv.appendChild(typing);

            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 隐藏输入中
        function removeTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) {
                typing.remove();
            }
        }

        // 生成AI响应（示例）
        function generateAIResponse(question) {
            const responses = {
                'TCP': 'TCP是面向连接的传输层协议，通过三次握手建立连接：1）客户端发送SYN；2）服务器回复SYN+ACK；3）客户端回复ACK。这个过程确保双方都准备好进行数据传输。',
                '进程': '进程是程序的一次执行，是系统进行资源分配的基本单位；线程是进程内的执行单元，共享进程的资源。主要区别：1）资源分配不同；2）开销不同；3）并发性不同。',
                '死锁': '死锁的四个必要条件：1）互斥条件；2）请求与保持条件；3）不可剥夺条件；4）循环等待条件。避免方法：破坏其中任一条件，如银行家算法。',
                '虚拟内存': '虚拟内存是一种内存管理技术，通过页表机制将逻辑地址转换为物理地址，实现内存的抽象和扩展。它允许程序使用比实际物理内存更大的地址空间。',
                'HTTP': 'HTTP是超文本传输协议，运行在TCP之上，是无状态的协议。HTTPS是HTTP的安全版本，通过SSL/TLS加密通信，确保数据传输的安全性。'
            };

            // 简单匹配关键词
            for (const [key, response] of Object.entries(responses)) {
                if (question.includes(key)) {
                    return response;
                }
            }

            return '这是一个很好的问题！作为AI Agent，我会智能调用工具来为您提供准确的答案。让我先查询相关知识库...';
        }
    </script>
</body>
</html>
