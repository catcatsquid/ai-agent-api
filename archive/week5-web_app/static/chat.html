<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 智能助手演示</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #7c3aed;
            --bg-primary: #ffffff;
            --bg-secondary: #f3f4f6;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
        }

        [data-theme="dark"] {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --bg-primary: #1f2937;
            --bg-secondary: #111827;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --border-color: #374151;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .chat-container {
            height: calc(100vh - 100px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) var(--bg-secondary);
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .chat-container::-webkit-scrollbar-thumb {
            background-color: var(--primary-color);
            border-radius: 4px;
        }

        .message {
            max-width: 70%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease;
        }

        .user-message {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 20px;
        }

        .agent-message {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 20px;
        }

        .typing-indicator {
            display: inline-flex;
            padding: 12px 20px;
            background-color: var(--bg-secondary);
            border-radius: 18px;
            margin: 10px auto;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--primary-color);
            margin: 0 3px;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feature-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
        }

        .source-tag {
            display: inline-block;
            background-color: rgba(79, 70, 229, 0.1);
            color: var(--primary-color);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-top: 5px;
        }

        .tool-call {
            background-color: rgba(124, 58, 237, 0.1);
            border-left: 4px solid var(--secondary-color);
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 0 8px 8px 0;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-robot text-2xl text-indigo-600 mr-3"></i>
                    <h1 class="text-xl font-bold">AI Agent 智能助手</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="clearChat()" class="px-4 py-2 text-sm bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
                        <i class="fas fa-trash mr-2"></i>清空对话
                    </button>
                    <button onclick="toggleTheme()" class="px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-800 transition">
                        <i class="fas fa-moon mr-2"></i>切换主题
                    </button>
                    <a href="https://github.com" target="_blank" class="text-gray-600 hover:text-gray-900">
                        <i class="fab fa-github text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto max-w-4xl mx-auto p-4">
        <!-- 功能说明卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="feature-card p-4 rounded-lg">
                <div class="flex items-center mb-2">
                    <i class="fas fa-brain text-indigo-600 text-xl mr-2"></i>
                    <h3 class="font-semibold">Plan-and-Execute</h3>
                </div>
                <p class="text-sm text-gray-600 dark:text-gray-400">智能规划任务，先思考后执行</p>
            </div>
            <div class="feature-card p-4 rounded-lg">
                <div class="flex items-center mb-2">
                    <i class="fas fa-tools text-purple-600 text-xl mr-2"></i>
                    <h3 class="font-semibold">多工具调用</h3>
                </div>
                <p class="text-sm text-gray-600 dark:text-gray-400">课程知识库+网络搜索+智能分析</p>
            </div>
            <div class="feature-card p-4 rounded-lg">
                <div class="flex items-center mb-2">
                    <i class="fas fa-history text-green-600 text-xl mr-2"></i>
                    <h3 class="font-semibold">多轮对话</h3>
                </div>
                <p class="text-sm text-gray-600 dark:text-gray-400">对话历史持久化，支持上下文理解</p>
            </div>
        </div>

        <!-- 聊天容器 -->
        <div class="chat-container bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 mb-4" id="chatContainer">
            <!-- 欢迎消息 -->
            <div class="text-center mb-8">
                <i class="fas fa-robot text-6xl text-indigo-600 mb-4"></i>
                <h2 class="text-2xl font-bold mb-2">欢迎体验 AI Agent</h2>
                <p class="text-gray-600 dark:text-gray-400">我将帮助您解答计算机网络和操作系统相关问题</p>
                <div class="mt-4 space-y-2">
                    <div class="inline-block p-2 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm">
                        <i class="fas fa-question-circle mr-1"></i>什么是TCP三次握手？
                    </div>
                    <div class="inline-block p-2 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm">
                        <i class="fas fa-question-circle mr-1"></i>解释进程和线程的区别
                    </div>
                    <div class="inline-block p-2 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm">
                        <i class="fas fa-question-circle mr-1"></i>死锁的四个必要条件是什么？
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-4">
            <form onsubmit="sendMessage(event)" class="flex gap-3">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="输入您的问题..."
                    class="flex-1 px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-white"
                    autocomplete="off"
                >
                <button
                    type="submit"
                    class="px-6 py-3 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition flex items-center font-semibold"
                >
                    <i class="fas fa-paper-plane mr-2"></i>发送
                </button>
            </form>

            <!-- 快捷问题 -->
            <div class="mt-4 flex flex-wrap gap-2">
                <button onclick="sendQuickQuestion('解释什么是虚拟内存')" class="px-3 py-1 text-sm bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    虚拟内存
                </button>
                <button onclick="sendQuickQuestion('进程调度算法有哪些')" class="px-3 py-1 text-sm bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    进程调度
                </button>
                <button onclick="sendQuickQuestion('HTTP和HTTPS的区别')" class="px-3 py-1 text-sm bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    HTTP vs HTTPS
                </button>
                <button onclick="sendQuickQuestion('什么是死锁？如何避免？')" class="px-3 py-1 text-sm bg-gray-100 dark:bg-gray-700 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    死锁
                </button>
            </div>
        </div>
    </div>

    <script>
        // 主题切换
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // 加载保存的主题
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // 清空对话
        function clearChat() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = `
                <div class="text-center mb-8">
                    <i class="fas fa-robot text-6xl text-indigo-600 mb-4"></i>
                    <h2 class="text-2xl font-bold mb-2">欢迎体验 AI Agent</h2>
                    <p class="text-gray-600 dark:text-gray-400">我将帮助您解答计算机网络和操作系统相关问题</p>
                </div>
            `;
        }

        // 发送快捷问题
        function sendQuickQuestion(question) {
            document.getElementById('messageInput').value = question;
            sendMessage({ preventDefault: () => {} });
        }

        // 添加消息到聊天容器
        function addMessage(content, isUser = false, metadata = {}) {
            const container = document.getElementById('chatContainer');

            // 移除欢迎消息（如果是第一条消息）
            const welcomeMsg = container.querySelector('.text-center');
            if (welcomeMsg) {
                welcomeMsg.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message mb-4 ${isUser ? 'user-message' : 'agent-message'}`;

            const timestamp = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            if (isUser) {
                messageDiv.innerHTML = `
                    <div class="flex items-end justify-end">
                        <div class="text-right mr-3">
                            <div class="text-xs text-gray-500">${timestamp}</div>
                        </div>
                        <img src="https://api.dicebear.com/7.x/personas/svg?seed=user" alt="User" class="w-8 h-8 rounded-full">
                        <div class="ml-3">
                            <div class="text-xs text-gray-500 mb-1">您</div>
                            <p class="p-3">${content}</p>
                        </div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="flex items-start">
                        <img src="https://api.dicebear.com/7.x/bots/svg?seed=ai" alt="AI" class="w-8 h-8 rounded-full">
                        <div class="ml-3">
                            <div class="text-xs text-gray-500 mb-1">AI Agent · ${timestamp}</div>
                            <p class="p-3">${content}</p>
                            ${metadata.sources ? `
                                <div class="mt-2">
                                    ${metadata.sources.map(source => `<span class="source-tag">${source}</span>`).join('')}
                                </div>
                            ` : ''}
                            ${metadata.tool_calls ? metadata.tool_calls.map(tool => `
                                <div class="tool-call mt-2">
                                    <i class="fas fa-tools mr-2"></i>
                                    <strong>${tool.tool}</strong>: ${tool.query}
                                </div>
                            `).join('') : ''}
                        </div>
                    </div>
                `;
            }

            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 显示输入中动画
        function showTypingIndicator() {
            const container = document.getElementById('chatContainer');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = `
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="ml-2 text-sm text-gray-500">AI Agent正在思考...</span>
            `;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 隐藏输入中动画
        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // 发送消息
        async function sendMessage(event) {
            event.preventDefault();

            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // 添加用户消息
            addMessage(message, true);
            input.value = '';

            // 显示输入中
            showTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: message,
                        thread_id: Date.now(),
                        max_steps: 8
                    })
                });

                if (!response.ok) {
                    throw new Error('网络请求失败');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';
                let toolCalls = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                hideTypingIndicator();
                                addMessage(fullResponse, false, { sources: extractSources(fullResponse), tool_calls: toolCalls });
                                return;
                            }

                            try {
                                const parsed = JSON.parse(data);

                                if (parsed.type === 'tool_call') {
                                    toolCalls.push({ tool: parsed.tool, query: parsed.query });
                                } else if (parsed.type === 'content') {
                                    fullResponse += parsed.content;
                                    hideTypingIndicator();
                                    addMessage(fullResponse, false, { sources: extractSources(fullResponse), tool_calls: toolCalls });
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }

            } catch (error) {
                hideTypingIndicator();
                addMessage('抱歉，发生了错误：' + error.message, false);
            }
        }

        // 提取来源
        function extractSources(response) {
            const sources = [];
            const sourceRegex = /来源：([^(）)]+)/g;
            let match;
            while ((match = sourceRegex.exec(response)) !== null) {
                sources.push(match[1].trim());
            }
            return sources;
        }
    </script>
</body>
</html>
